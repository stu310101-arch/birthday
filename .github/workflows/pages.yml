name: Publish birthday website

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'setup.html'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: birthday-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish birthday website to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static website
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s setup.html
          mkdir -p _site
          cp index.html setup.html _site/
          touch _site/.nojekyll
          printf '%s\n' "$GITHUB_SHA" > _site/site-version.txt

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record live website address
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          printf '## Birthday website published\n\n%s\n' "$PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
