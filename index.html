*{box-sizing:border-box}html{width:100%;height:100%;overflow:hidden}body{width:100%;height:100svh;margin:0;background:#543828;min-height:100vh;min-height:100svh;overflow:hidden}button,input,textarea{font:inherit}button,a,textarea{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:default}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #ba7958;outline-offset:4px}button{touch-action:manipulation}button svg{pointer-events:none}svg{display:block}button{border:0}button:disabled{opacity:.5}[hidden]{display:none!important}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.room{position:fixed;inset:0;overflow:hidden;pointer-events:none;background:#b7784b}.room-image{position:absolute;inset:-1px;background-image:var(--room-image);background-size:cover;background-position:50% 50%;transform-origin:50% 35%;transition:transform var(--open-duration) cubic-bezier(.2,.65,.25,1),filter var(--open-duration)}.room-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(42,25,17,.37),rgba(61,35,16,.06) 48%,rgba(45,27,22,.12) 70%,rgba(39,24,18,.55));transition:background 2s}.room-vignette{position:absolute;inset:0;box-shadow:inset 0 0 15vw 3vw #3c25183a}

.dust{position:absolute;width:3px;height:3px;background:#ffe4a6;border-radius:50%;box-shadow:0 0 12px #ffc774;opacity:0;animation:drift 9s ease-in-out infinite}.dust:nth-child(1){left:15%;top:38%;animation-delay:-2s}.dust:nth-child(2){left:29%;top:57%;animation-delay:-5s}.dust:nth-child(3){left:77%;top:43%;animation-delay:-7s}.dust:nth-child(4){left:86%;top:67%;animation-delay:-4s}.dust:nth-child(5){left:62%;top:25%;animation-delay:-1s}.dust:nth-child(6){left:37%;top:35%;animation-delay:-6s}@keyframes drift{0%,100%{opacity:0;transform:translate(0,12px)}50%{opacity:.75;transform:translate(12px,-16px)}}

class BirthdayMusic {

  }

  start(track='ambient',restart=false){
    this.track=track;if(!this.init())return;this.resume();
    if(this.started&&!restart&&this.activeTrack===track){this.update();return;}
    clearInterval(this.timer);
    if(this.bus){const old=this.bus;old.gain.cancelScheduledValues(this.ctx.currentTime);old.gain.setTargetAtTime(0,this.ctx.currentTime,.12);setTimeout(()=>{try{old.disconnect();}catch{}},1800);}
    this.bus=this.ctx.createGain();this.bus.gain.setValueAtTime(0,this.ctx.currentTime);this.bus.gain.linearRampToValueAtTime(1,this.ctx.currentTime+.3);this.bus.connect(this.master);
    const score=this.score(track);this.events=score.events;this.duration=score.duration;this.startAt=this.ctx.currentTime+.08;this.index=0;this.cycle=0;

  score(track){
    const events=[];const add=(at,midi,duration,voice='bell',gain=1)=>events.push({at,midi,duration,voice,gain});

        [77,81,84,81,79,77,76,74], [74,79,83,81,79,76,74,0],
        [76,79,84,83,81,79,76,74], [72,76,79,76,74,72,69,0],
        [77,81,79,77,76,74,72,74], [79,76,74,71,72,0,79,0]
      ];
      const chords=[[48,52,55],[55,59,62],[53,57,60],[55,59,62],[48,52,55],[45,48,52],[53,57,60],[55,59,62]];
      for(let bar=0;bar<8;bar++){
        const start=bar*4*beat,chord=chords[bar];
        melody[bar].forEach((note,i)=>{if(note)add(start+i*.5*beat,note,.42*beat,'bell',.65);});
        add(start,chord[0]-12,1.6*beat,'bass',.55);add(start+2*beat,chord[0]-5,1.5*beat,'bass',.4);
        [0.5,1.5,2.5,3.5].forEach((b,j)=>chord.forEach((n,k)=>add(start+b*beat+k*.023,n+12,.65*beat,'pluck',j%2?.35:.45)));
      }

    const beat=60/138;
    const tune=[[67,.75],[67,.25],[69,1],[67,1],[72,1],[71,2],
      [67,.75],[67,.25],[69,1],[67,1],[74,1],[72,2],
      [67,.75],[67,.25],[79,1],[76,1],[72,1],[71,1],[69,2],

    const bars=[
      {root:48,chord:[60,64,67]}, {root:43,chord:[59,62,65]},
      {root:43,chord:[59,62,67]}, {root:48,chord:[60,64,67]},
      {root:48,chord:[60,64,67]}, {root:53,chord:[60,65,69]},

    if(!this.noiseBuffer){
      this.noiseBuffer=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*.2),ctx.sampleRate);
      const samples=this.noiseBuffer.getChannelData(0);for(let i=0;i<samples.length;i++)samples[i]=Math.random()*2-1;
    }
    const source=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),env=ctx.createGain();source.buffer=this.noiseBuffer;
    filter.type=voice==='shaker'?'highpass':'bandpass';filter.frequency.value=voice==='shaker'?6500:1800;filter.Q.value=.65;
    const length=voice==='shaker'?.045:.105,level=(voice==='shaker'?.09:.13)*gain;
    env.gain.setValueAtTime(.0001,at);env.gain.exponentialRampToValueAtTime(level,at+.003);env.gain.exponentialRampToValueAtTime(.0001,at+length);
    source.connect(filter);filter.connect(env);env.connect(bus);source.start(at);source.stop(at+length+.02);source.onended=()=>{source.disconnect();filter.disconnect();env.disconnect();};
  }
  ping(){if(!this.ctx||this.muted)return;const t=this.ctx.currentTime;this.note(84,t,.15,'bell',.25);this.note(88,t+.09,.2,'bell',.2);}
  blow(){
    if(!this.ctx||this.muted)return;const c=this.ctx,len=Math.floor(c.sampleRate*.35),buffer=c.createBuffer(1,len,c.sampleRate),d=buffer.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.sin(i/len*Math.PI)*.2;
    const source=c.createBufferSource(),filter=c.createBiquadFilter(),gain=c.createGain();source.buffer=buffer;filter.type='lowpass';filter.frequency.value=900;gain.gain.value=.35;source.connect(filter);filter.connect(gain);gain.connect(this.master);source.start();source.onended=()=>{source.disconnect();filter.disconnect();gain.disconnect();};
  }
  toggle(){
    if(!this.started){this.muted=false;this.start(state.blown?'birthday':'ambient');return;}
    this.muted=!this.muted;this.resume();if(this.master)this.master.gain.setTargetAtTime(this.muted?0:.42,this.ctx.currentTime,.08);this.update();
  }
  update(){
    const on=this.started&&!this.muted&&!this.unavailable;
    $('soundButton').dataset.playing=String(on);$('soundButton').setAttribute('aria-pressed',String(on));$('soundButton').setAttribute('aria-label',on?'靜音音樂':'開啟音樂');
    $('soundLabel').textContent=this.unavailable?'音樂不可用':on?(this.track==='birthday'?'生日快樂':'溫柔放送中'):this.started?'音樂已靜音':'開啟音樂';
    $('musicDock').classList.toggle('active',on);
  }
}
const music=new BirthdayMusic();
$('soundButton').addEventListener('click',()=>music.toggle());$('musicDock').addEventListener('click',()=>music.toggle());
document.addEventListener('visibilitychange',()=>{
  if(!music.ctx)return;
  if(document.hidden&&music.ctx.state==='running'){music.hiddenPaused=true;music.ctx.suspend().catch(()=>{});}
  else if(!document.hidden&&music.hiddenPaused){music.hiddenPaused=false;music.ctx.resume().catch(()=>{});}
});

// 慢慢掀開上蓋：同一片 DOM 由 -104° 連續旋轉到 0°，不是切圖。
$('openButton').addEventListener('click',async()=>{
  if(state.started)return;state.started=true;$('openButton').disabled=true;
  music.start('ambient');phase('opening');$('openControl').classList.add('leaving');$('hero').setAttribute('aria-hidden','true');
  await sleep(reduceMotion?200:CONFIG.openingMs+100);
  $('openControl').hidden=true;$('lidFront').inert=false;$('boot').classList.add('finished');
  await sleep(reduceMotion?80:600);$('boot').hidden=true;
  openChat();await deliverMessages();
});
function openChat(){
  if(!state.started)return;
  state.chatOpen=true;phase(state.finished?'reply':'chat');$('chatWindow').hidden=false;$('chatDock').classList.add('active');$('cakeDock').classList.remove('active');
  $('chatTitle').focus({preventScroll:true});scrollChat();
}
// 每個空白行隔開的段落是一則訊息；同一段內的換行在聊天泡泡中保留。
async function showFinalCountdown(){
  $('typing').hidden=true;
  $('chatStatus').textContent='最後倒數…';
  const countdown=document.createElement('div');
  countdown.className='chat-countdown';
  countdown.setAttribute('role','status');
  countdown.setAttribute('aria-live','polite');
  const label=document.createElement('span');label.textContent='最後倒數';
  const numberDisplay=document.createElement('strong');
  countdown.append(label,numberDisplay);
  $('chatLog').insertBefore(countdown,$('typing'));
  for(let remaining=5;remaining>=1;remaining--){
    numberDisplay.textContent=String(remaining);
    scrollChat();
    await sleep(1000);
  }
  countdown.classList.add('done');
  countdown.textContent='5 · 4 · 3 · 2 · 1';
  $('chatStatus').textContent='正在輸入…';
  scrollChat();
}
async function deliverMessages(){
  const messages=CONFIG.messages;
  for(let i=0;i<messages.length;i++){
    const rightAfterCountdown=i>0&&messages[i-1]===CONFIG.countdownAfterMessage;
    if(!rightAfterCountdown){
      $('typing').hidden=false;
      $('chatStatus').textContent='正在輸入…';
      scrollChat();
      await sleep(CONFIG.messageIntervalMs);
    }
    $('typing').hidden=true;
    const row=document.createElement('div');row.className='message-row incoming';
    const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=messages[i];
    const time=document.createElement('span');time.className='bubble-time';time.textContent=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false});
    row.append(bubble,time);$('chatLog').insertBefore(row,$('typing'));music.ping();
    // 長訊息先讓使用者從開頭閱讀，不強制跳到泡泡最下方。
    if(row.getBoundingClientRect().height>chatLogEl.clientHeight*.72){
      followChat=false;showCatchUp();
    }else{
      scrollChat();
    }
    if(messages[i]===CONFIG.countdownAfterMessage)await showFinalCountdown();
  }
  $('typing').hidden=true;state.finished=true;phase('reply');$('chatStatus').textContent='';$('chatStatus').parentElement.hidden=true;$('chatTitle').style.marginBottom='0';
  $('replyInput').disabled=false;$('replyInput').placeholder='換你說了，想回覆些什麼？';$('closeChat').hidden=false;$('chatDock').disabled=false;$('cakeDock').disabled=false;$('confirmWishes').disabled=false;
  const note=document.createElement('p');note.className='end-note';note.textContent='可以回覆，也可以不回覆直接按右上角叉叉\n去看看另一份驚喜。';note.style.whiteSpace='pre-line';$('chatLog').append(note);
  updateSendButton();scrollChat();
}
function closeChat(){
  if(!state.finished)return;state.chatOpen=false;$('chatWindow').hidden=true;phase(state.blown?'celebrating':'desktop');
  $('chatDock').classList.remove('active');$('cakeDock').classList.add('active');$(state.wishesConfirmed?'blowButton':'confirmWishes').focus({preventScroll:true});
}
$('closeChat').addEventListener('click',closeChat);$('cakeDock').addEventListener('click',closeChat);$('chatDock').addEventListener('click',openChat);
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.chatOpen&&state.finished)closeChat();});

// 按下送出才提交文字；不跳郵件程式，也不在網路失敗時假裝寄送成功。
// FormSubmit 負責寄信，瀏覽器不儲存 SMTP 密碼或私密 API key。
function updateSendButton(){$('sendButton').disabled=!state.finished||state.sending||!$('replyInput').value.trim();}
function mailStatus(text,isError=false){$('mailStatus').hidden=false;$('mailStatus').textContent=text;$('mailStatus').classList.toggle('error',isError);}
function mailSourceURL(){
  const candidate=CONFIG.siteUrl||location.href;
  try{const url=new URL(candidate);if(!/^https?:$/.test(url.protocol))return '';return url.origin+url.pathname;}catch{return '';}
}
$('replyInput').addEventListener('input',updateSendButton);
$('replyInput').addEventListener('keydown',event=>{
  // Enter 寄出、Shift+Enter 換行；避免在中文輸入法組字時誤送。
  if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing&&event.keyCode!==229){event.preventDefault();if(!$('sendButton').disabled)$('replyForm').requestSubmit();}
});
$('replyForm').addEventListener('submit',async event=>{
  event.preventDefault();if(!state.finished||state.sending)return;
  const message=$('replyInput').value.trim();if(!message){mailStatus('寫下一點想說的話，再按送出吧。');return;}
  if(message.length>2000){mailStatus('回覆請控制在 2,000 個字元以內。',true);return;}
  if($('honey').value)return;
  state.lastReply=message;state.sending=true;$('sendButton').classList.add('busy');$('replyInput').readOnly=true;updateSendButton();mailStatus('正在寄出回覆…');
  const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),CONFIG.mailTimeoutMs);
  try{
    const payload={name:'生日網頁的回覆',message,_subject:CONFIG.emailSubject,_template:'table',_captcha:'false',_honey:''};
    const source=mailSourceURL();if(source)payload._url=source;
    const response=await fetch(`https://formsubmit.co/ajax/${encodeURIComponent(CONFIG.recipientEmail)}`,{
      method:'POST',mode:'cors',credentials:'omit',headers:{'Content-Type':'application/json','Accept':'application/json'},signal:controller.signal,
      body:JSON.stringify(payload)
    });
    const data=await response.json().catch(()=>null);
    if(!data||typeof data!=='object')throw new Error('INVALID_RESPONSE');
    const serviceMessage=String(data.message||'');
    const activation=/activat|confirm.{0,45}(?:email|form)|驗證|啟用/i.test(serviceMessage);
    if(activation){
      mailStatus('收件信箱尚待啟用；請網站擁有者完成驗證。你的回覆已保留，尚未確認寄出。',true);
      if(!state.chatOpen)toast('回覆尚待信箱啟用，文字已保留。');return;
    }
    if(!response.ok||!(data.success===true||data.success==='true')){
      const error=new Error('SEND_NOT_ACCEPTED');
      if(/web server|brows.{0,30}html|_url|unable to submit|invalid.{0,15}url/i.test(serviceMessage)&&!source)error.message='WEB_URL_REQUIRED';
      throw error;
    }
    const row=document.createElement('div');row.className='message-row outgoing';
    const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=message;row.append(bubble);$('chatLog').append(row);
    const label=document.createElement('div');label.className='delivery-label';label.textContent='已提交寄信服務 ♡';$('chatLog').append(label);
    $('replyInput').value='';mailStatus('回覆已提交 ♡');scrollChat();
    if(!state.chatOpen)toast('回覆已提交 ♡');
  }catch(error){
    let text='暫時無法確認寄送，回覆已保留。請確認網路後再按送出。';
    if(error.name==='AbortError')text='寄送等候逾時，回覆已保留。請先確認收件信箱，再決定是否重試，以免重複寄送。';
    else if(error.message==='WEB_URL_REQUIRED')text='請透過網站網址開啟這個頁面後再試。你的回覆已保留。';
    mailStatus(text,true);if(!state.chatOpen)toast('寄送尚未確認，文字已保留在聊天視窗。');
  }finally{clearTimeout(timeout);state.sending=false;$('sendButton').classList.remove('busy');$('replyInput').readOnly=false;updateSendButton();}
});

$('confirmWishes').addEventListener('click',()=>{
  if(!state.finished||state.chatOpen||state.wishesConfirmed||state.blown)return;
  state.wishesConfirmed=true;
  $('confirmWishes').hidden=true;
  $('blowButton').hidden=false;
  $('blowButton').disabled=false;
  $('cakeTitle').textContent='18 歲，願你盡情閃耀。';
  $('cakeCaption').textContent='三個願望都收好了，現在可以吹熄蠟燭。';
  $('blowButton').focus({preventScroll:true});
});

$('blowButton').addEventListener('click',()=>{
  if(!state.finished||!state.wishesConfirmed||state.chatOpen)return;
  if(state.blown){music.start('birthday',true);celebrate();return;}
  state.blown=true;phase('celebrating');$('cakeArt').classList.add('is-blown');$('cakeArt').setAttribute('aria-label','十八歲巧克力蛋糕，數字 18 蠟燭已吹熄');
  $('cakeEyebrow').textContent='YOUR NEXT CHAPTER BEGINS';$('cakeTitle').textContent='願我們在頂峰相見!';$('cakeCaption').textContent='';$('cakeCaption').hidden=true;$('blowLabel').textContent='再聽一次生日歌';$('resetButton').hidden=false;
  music.blow();music.start('birthday',true);celebrate();
});
$('resetButton').addEventListener('click',()=>{
  if(state.sending){toast('回覆仍在送出中；請先確認寄信結果再重播。');return;}
  if($('replyInput').value.trim()&&!confirm('重新開始會清除未寄出的文字，確定重播嗎？'))return;
  location.reload();
});
let confettiRAF=0;
function celebrate(){
  if(reduceMotion)return;
  cancelAnimationFrame(confettiRAF);const canvas=$('confetti'),context=canvas.getContext('2d');if(!context)return;
  const dpr=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);context.setTransform(dpr,0,0,dpr,0,0);
  const colors=['#f1c878','#edb1a0','#f8e5bf','#adba96','#d39873'];
  const particles=Array.from({length:100},(_,i)=>({x:w/2+(Math.random()-.5)*w*.5,y:h*.35+Math.random()*h*.12,vx:(Math.random()-.5)*6,vy:-4-Math.random()*7,rotation:Math.random()*Math.PI,spin:(Math.random()-.5)*.12,width:4+Math.random()*5,height:3+Math.random()*5,color:colors[i%colors.length]}));
  let started=performance.now(),last=started;
  function frame(now){const dt=Math.min(2,(now-last)/16.67);last=now;const elapsed=now-started;context.clearRect(0,0,w,h);context.globalAlpha=Math.max(0,1-Math.max(0,elapsed-3300)/1700);
    for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.055*dt;p.rotation+=p.spin*dt;context.save();context.translate(p.x,p.y);context.rotate(p.rotation);context.fillStyle=p.color;context.fillRect(-p.width/2,-p.height/2,p.width,p.height);context.restore();}
    if(elapsed<5000)confettiRAF=requestAnimationFrame(frame);else context.clearRect(0,0,w,h);
  }
  confettiRAF=requestAnimationFrame(frame);
}
function updateClock(){$('clock').textContent=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false});}
updateClock();setInterval(updateClock,30000);
</script>
